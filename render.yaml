services:
  - type: web
    name: smartstore-ai-marketplace
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: corepack prepare pnpm@10.32.1 --activate && corepack pnpm install --frozen-lockfile && corepack pnpm build
    preDeployCommand: corepack prepare pnpm@10.32.1 --activate && corepack pnpm db:deploy
    startCommand: node scripts/start.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_SEARCH_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_VISION_MODEL
        value: deepseek-flash
      - key: SMARTSTORE_DEEPSEEK_MAX_CONCURRENT_REQUESTS
        value: "100"
      - key: SMARTSTORE_DEEPSEEK_MAX_QUEUED_REQUESTS
        value: "2000"
      - key: SMARTSTORE_DEEPSEEK_QUEUE_TIMEOUT_MS
        value: "60000"
      - key: SMARTSTORE_HEALTH_INCLUDE_METRICS
        value: "0"
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SMARTSTORE_MARKETPLACE_STORE
        value: database
      - key: SMARTSTORE_MAX_LISTINGS_PER_SELLER
        sync: false
      - key: SMARTSTORE_ADMIN_EMAILS
        sync: false
      - key: SMARTSTORE_ENABLE_ADMIN_MAINTENANCE_CLEANUP
        value: "0"
      - key: SMARTSTORE_IMAGE_STORAGE
        sync: false
      - key: SMARTSTORE_MAX_IMAGES_PER_LISTING
        sync: false
      - key: SMARTSTORE_COMMISSION_ALRAJHI_ACCOUNT_NAME
        sync: false
      - key: SMARTSTORE_COMMISSION_ALRAJHI_ACCOUNT_NUMBER
        sync: false
      - key: SMARTSTORE_COMMISSION_ALRAJHI_IBAN
        sync: false
      - key: SMARTSTORE_COMMISSION_SNB_ACCOUNT_NAME
        sync: false
      - key: SMARTSTORE_COMMISSION_SNB_ACCOUNT_NUMBER
        sync: false
      - key: SMARTSTORE_COMMISSION_SNB_IBAN
        sync: false
      - key: SMARTSTORE_COMMISSION_STC_PAY_NAME
        sync: false
      - key: SMARTSTORE_COMMISSION_STC_PAY_NUMBER
        sync: false
      - key: SMARTSTORE_COMMISSION_STC_PAY_ACCOUNT
        sync: false
      - key: SMARTSTORE_OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: SMARTSTORE_OBJECT_STORAGE_BUCKET
        sync: false
      - key: SMARTSTORE_OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SMARTSTORE_OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: SMARTSTORE_OBJECT_STORAGE_REGION
        value: auto
      - key: SMARTSTORE_OBJECT_STORAGE_PUBLIC_URL
        sync: false
      - key: SMARTSTORE_RATE_LIMIT_BACKEND
        sync: false
      - key: SMARTSTORE_VAPID_PUBLIC_KEY
        sync: false
      - key: SMARTSTORE_VAPID_PRIVATE_KEY
        sync: false
      - key: SMARTSTORE_VAPID_SUBJECT
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

