# Project-scoped diagnostics only; global servers and authentication are preserved.
[mcp_servers.chrome_devtools]
command = "C:/Program Files/nodejs/node.exe"
args = [
  "C:/Users/maher/Desktop/SmartStoreAI/.data/environment-audit/tools/node_modules/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js",
  "--executable-path=C:/Program Files/Google/Chrome/Application/chrome.exe",
  "--headless",
  "--isolated",
  "--filesystem-root=C:/Users/maher/Desktop/SmartStoreAI",
  "--no-usage-statistics",
  "--no-performance-crux",
]
startup_timeout_sec = 60
tool_timeout_sec = 90
enabled = true

[mcp_servers.chrome_devtools.env]
CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS = "1"
TEMP = "C:/Users/maher/Desktop/SmartStoreAI/.data/environment-audit/browser-temp"
TMP = "C:/Users/maher/Desktop/SmartStoreAI/.data/environment-audit/browser-temp"

# The existing GitHub bridge forwards this documented server option to its child.
# It hides write tools without changing the stored account credential or scopes.
[mcp_servers.github.env]
GITHUB_READ_ONLY = "1"
