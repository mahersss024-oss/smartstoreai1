name: Production Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality, Build, And Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit and integration-safe tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          AUTH_SECRET: ci-only-smartstore-auth-secret-with-enough-length
          DEEPSEEK_API_KEY: ci-placeholder
          SMARTSTORE_MARKETPLACE_STORE: file

      - name: Dependency audit
        run: pnpm audit --audit-level moderate

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E journey tests
        run: pnpm test:e2e
        env:
          AUTH_SECRET: ci-only-smartstore-auth-secret-with-enough-length
          DEEPSEEK_API_KEY: ci-placeholder
          SMARTSTORE_MARKETPLACE_STORE: file

  optional-db-integration:
    name: Optional Staging DB Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.RUN_STAGING_DB_INTEGRATION == '1' }}
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SMARTSTORE_DB_INTEGRATION: "1"
      SMARTSTORE_MARKETPLACE_STORE: database
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy migrations to staging database
        run: pnpm db:deploy

      - name: Run staging database integration test
        run: pnpm test:db:integration
