version: 1.0
runtime: nodejs22

build:
  commands:
    pre-build:
      - corepack enable
      - corepack prepare pnpm@10.32.1 --activate
      - pnpm install --frozen-lockfile
    build:
      - pnpm build

run:
  command: node scripts/start.mjs
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: NEXT_PUBLIC_APP_URL
      value: https://rjkg7cwsg8.eu-central-1.awsapprunner.com
    - name: SMARTSTORE_MARKETPLACE_STORE
      value: database
    - name: SMARTSTORE_HEALTH_INCLUDE_METRICS
      value: "0"
    - name: SMARTSTORE_ENABLE_ADMIN_MAINTENANCE_CLEANUP
      value: "0"
    - name: SMARTSTORE_DEEPSEEK_MAX_CONCURRENT_REQUESTS
      value: "100"
    - name: SMARTSTORE_DEEPSEEK_MAX_QUEUED_REQUESTS
      value: "2000"
    - name: SMARTSTORE_DEEPSEEK_QUEUE_TIMEOUT_MS
      value: "60000"
    - name: SMARTSTORE_MAX_IMAGES_PER_LISTING
      value: "8"
    - name: SMARTSTORE_MAX_LISTINGS_PER_SELLER
      value: "100"
    - name: SMARTSTORE_PUBLIC_CACHE_REDIS_TIMEOUT_MS
      value: "1500"
  secrets:
    - name: DATABASE_URL
      value-from: "arn:aws:secretsmanager:eu-central-1:102913100808:secret:smartstore/DATABASE_URL-fIsmZe:DATABASE_URL::"

    - name: AUTH_SECRET
      value-from: "arn:aws:secretsmanager:eu-central-1:102913100808:secret:smartstore/app-RLQXFC:AUTH_SECRET::"
    - name: GOOGLE_CLIENT_ID
      value-from: "arn:aws:secretsmanager:eu-central-1:102913100808:secret:smartstore/app-RLQXFC:GOOGLE_CLIENT_ID::"
    - name: GOOGLE_CLIENT_SECRET
      value-from: "arn:aws:secretsmanager:eu-central-1:102913100808:secret:smartstore/app-RLQXFC:GOOGLE_CLIENT_SECRET::"
    - name: APPLE_CLIENT_ID
      value-from: "arn:aws:secretsmanager:eu-central-1:102913100808:secret:smartstore/app-RLQXFC:APPLE_CLIENT_ID::"
    - name: APPLE_TEAM_ID
      value-from: "arn:aws:secretsmanager:eu-central-1:102913100808:secret:smartstore/app-RLQXFC:APPLE_TEAM_ID::"
    - name: APPLE_KEY_ID
